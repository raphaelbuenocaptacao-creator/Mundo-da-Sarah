const SAVE='mundoSarahLife4';let s=JSON.parse(localStorage.getItem(SAVE)||'null')||{x:47,y:56,coins:60,hunger:82,energy:88,fun:90,hygiene:92,dress:0,xp:0,day:1,zoom:1};const $=id=>document.getElementById(id),avatar=$('avatar'),viewport=$('viewport'),bubble=$('bubble'),objs=[...document.querySelectorAll('.obj')];let near=null,hold=null,walkTimer=null;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function save(){localStorage.setItem(SAVE,JSON.stringify(s))}function level(){return 1+Math.floor(s.xp/25)}function render(){avatar.style.left=s.x+'%';avatar.style.top=s.y+'%';$('coins').textContent=s.coins;$('level').textContent=level();$('day').textContent=s.day;['hunger','energy','fun','hygiene'].forEach(k=>$(k).style.width=clamp(s[k],0,100)+'%');$('dress').style.background=['#8b63d7','#ed6db1','#63aee8','#f0b650'][s.dress%4];$('house').style.transform=`scale(${s.zoom})`;detect();save()}function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1200)}function say(t){bubble.textContent=t;bubble.classList.add('show');setTimeout(()=>bubble.classList.remove('show'),1300)}function step(dx,dy){s.x=clamp(s.x+dx,5,95);s.y=clamp(s.y+dy,10,92);s.energy=clamp(s.energy-.05,0,100);avatar.classList.add('walk');clearTimeout(walkTimer);walkTimer=setTimeout(()=>avatar.classList.remove('walk'),130);render()}function detect(){near=null;const a=avatar.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2;let best=88;objs.forEach(o=>{o.classList.remove('near');const r=o.getBoundingClientRect(),d=Math.hypot(ax-(r.left+r.width/2),ay-(r.top+r.height/2));if(d<best){best=d;near=o}});if(near)near.classList.add('near');$('action').textContent=near?'✨ USAR':'✨ AÇÃO'}function reward(n,msg){s.coins+=n;s.xp+=Math.max(1,n);toast(msg)}const acts={eat(){s.hunger=100;reward(2,'Lanchinho pronto! +2 ⭐');say('Que delícia! 🧁')},cook(){s.hunger=clamp(s.hunger+35,0,100);reward(4,'Cozinhou! +4 ⭐');say('Eu consegui! 🍳')},sleep(){s.energy=100;s.da
