or:#5c3d67;font-weight:1000;box-shadow:0 7px 18px #644a7620}.action i{display:block;font-style:normal;font-size:28px;margin-bottom:4px}.panel{margin:0 14px 16px;padding:14px;border-radius:23px;background:#ffffffc9}.quests{display:flex;gap:8px;overflow:auto}.quest{min-width:165px;background:#fff;border-radius:17px;padding:10px;font-size:12px;font-weight:900}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(960px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fffffff0;backdrop-filter:blur(16px);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -8px 28px #684b7820}.nav{border:0;background:none;font-size:11px;font-weight:900;color:#77557e}.nav i{display:block;font-style:normal;font-size:22px}.toast{position:fixed;z-index:90;left:50%;bottom:95px;transform:translateX(-50%);background:#563b62;color:white;border-radius:999px;padding:11px 15px;font-weight:900;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1;bottom:108px}.modal{display:none;position:fixed;inset:0;background:#6d4b83aa;z-index:80;place-items:end center}.modal.on{display:grid}.sheet{width:min(960px,100%);background:linear-gradient(#fff,#f8ebff);border-radius:28px 28px 0 0;padding:18px;max-height:72vh;overflow:auto}.sheet h2{margin:0 0 12px}.close{float:right;border:0;background:#eee0f7;border-radius:14px;padding:9px 12px;font-weight:900}.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.item{border:0;background:#fff;border-radius:18px;padding:12px;font-size:13px;font-weight:900;color:#624169;box-shadow:0 6px 14px #0001}.item strong{display:block;font-size:34px}.day{font-size:12px;font-weight:900;opacity:.8;margin:8px 14px 0}.spark{position:absolute;pointer-events:none;font-size:22px;animation:pop .8s forwards}@keyframes pop{to{transform:translateY(-45px) scale(1.5);opacity:0}}@media(max-width:520px){.scene{min-height:385px}.house{height:70%;bottom:8%}.avatar{transform:translateX(-50%) scale(.88);transform-o </style></head><body><div class="app"><header class="top"><div class="row"><div class="brand">👑 Minha Vida Mágica<small>Mundo da Sarah</small></div><div class="coins"><div class="pill">⭐ <span id="stars">120</span></div><div class="pill">💎 <span id="gems">8</span></div></div></div><div class="needs"><div class="need">🍎 Fome<div class="bar"><i id="hunger"></i></div></div><div class="need">⚡ Energia<div class="bar"><i id="energy"></i></div></div><div class="need">🎉 Diversão<div class="bar"><i id="fun"></i></div></div><div class="need">🛁 Higiene<div class="bar"><i id="clean"></i></div></div></div></header><div class="day">☀️ <span id="day">Dia 1</span> • <span id="clock">08:00</span> • Casa da Sarah</div><main class="sceneWrap"><div class="scene" id="scene"><div class="sky"></div><div class="sun">☀️</div><div class="cloud" style="left:8%;top:7%">☁️</div><div class="cloud" style="left:48%;top:12%">☁️</div><div class="house"><button class="room bedroom" onclick="goRoom('bedroom')"><b>🛏️ Quarto</b><span class="obj o1">🛏️</span><span class="obj o2">🧸</span><span class="obj o3">🌙</span></button><button class="room kitchen" onclick="goRoom('kitchen')"><b>🍓 Cozinha</b><span class="obj o1">🍰</span><span class="obj o2">🧃</span><span class="obj o3">🍓</span></button><button class="room closet" onclick="goRoom('closet')"><b>👗 Closet</b><span class="obj o1">👗</span><span class="obj o2">👑</span><span class="obj o3">🪞</span></button><button class="room garden" onclick="goRoom('garden')"><b>🌷 Jardim</b><span class="obj o1">🦄</span><span class="obj o2">🌷</span><span class="obj o3">🚲</span></button></div><div class="avatar" id="avatar"><div class="nameTag">Sarah ✨</div><div class="hairBack"></div><div class="head"></div><div class="bang"></div><div class="eyes">••</div><div class="smile">◡</div><div class="body" id="body"></div><div class="skirt" id="skirt"></div><div class="leg l1"></div><div class="leg l2"></div></div></div></main><section class="actions"><div class="title" id="roomTitle">🛏️ Quarto da Sarah</div><div class="actiongrid" id="actiongrid"></div></section><section class="panel"><div class="title">✨ Missões de hoje</div><div class="quests"><div class="quest">🍎 Tomar café<br><small>+10 ⭐</small></div><div class="quest">🦄 Brincar com o pet<br><small>+15 ⭐</small></div><div class="quest">👗 Trocar de roupa<br><small>+10 ⭐</small></div><div class="quest">🌷 Regar as flores<br><small>+12 ⭐</small></div></div></section></div><nav class="bottom"><button class="nav" onclick="goRoom('bedroom')"><i>🏠</i>Casa</button><button class="nav" onclick="openShop()"><i>🛍️</i>Loja</button><button class="nav" onclick="openCloset()"><i>👗</i>Roupas</button><button class="nav" onclick="goRoom('garden')"><i>🦄</i>Pets</button><button class="nav" onclick="gift()"><i>🎁</i>Presente</button></nav><div class="toast" id="toast"></div><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">Fechar ✕</button><h2 id="modalTitle">Loja</h2><div id="modalBody"></div></div></div><script>
const KEY='sarahLifeSim1';const defaults={stars:120,gems:8,hunger:82,energy:78,fun:88,clean:90,day:1,hour:8,room:'bedroom',dress:0,pet:'🦄',owned:[0]};let s=Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'));
const rooms={bedroom:{title:'🛏️ Quarto da Sarah',pos:[27,50],actions:[['😴','Dormir','energy',28],['🧸','Brincar','fun',18],['📖','História','fun',12],['🛁','Banho','clean',30]]},kitchen:{title:'🍓 Cozinha Encantada',pos:[68,50],actions:[['🍓','Comer frutas','hunger',25],['🍰','Fazer bolo','fun',14],['🧃','Tomar suco','hunger',15],['🥪','Lanchinho','hunger',20]]},closet:{title:'👗 Closet de Princesa',pos:[27,14],actions:[['👗','Trocar look','closet',0],['👑','Usar coroa','fun',10],['🪞','Espelho','fun',8],['✨','Se arrumar','clean',15]]},garden:{title:'🌷 Jardim Mágico',pos:[68,14],actions:[['🦄','Brincar com pet','fun',25],['🌷','Regar flores','fun',12],['🚲','Andar de bike','fun',18],['🦋','Ver borboletas','energy',6]]}};
function save(){localStorage.setItem(KEY,JSON.stringify(s));render()}function render(){stars.textContent=s.stars;gems.textContent=s.gems;day.textContent='Dia '+s.day;clock.textContent=String(s.hour).padStart(2,'0')+':00';[['hunger',s.hunger],['energy',s.energy],['fun',s.fun],['clean',s.clean]].forEach(([id,v])=>document.getElementById(id).style.width=Math.max(0,Math.min(100,v))+'%');let r=rooms[s.room];roomTitle.textContent=r.title;actiongrid.innerHTML=r.actions.map((a,i)=>`<button class="action" onclick="act(${i})"><i>${a[0]}</i>${a[1]}</button>`).join('');let p=r.pos;avatar.style.left=p[0]+'%';avatar.style.bottom=p[1]+'%';const colors=[['#9b6ee8','#5c3d80'],['#ff71b8','#b34083'],['#75c9ff','#4878c9'],['#ffd166','#d28f28'],['#80d6a4','#3b8d65']][s.dress]||['#9b6ee8','#5c3d80'];body.style.background=colors[0];skirt.style.background=colors[1]}
function goRoom(r){s.room=r;tick(1);save();spark();}
function act(i){const a=rooms[s.room].actions[i];if(a[2]==='closet'){openCloset();return}s[a[2]]=Math.min(100,s[a[2]]+a[3]);s.stars+=5;tick(1);save();toastMsg(a[1]+'! +5 ⭐');spark()}
function tick(h){s.hour+=h;if(s.hour>=22){s.day++;s.hour=8;s.energy=Math.min(100,s.energy+25)}s.hunger=Math.max(0,s.hunger-2*h);s.energy=Math.max(0,s.energy-1*h);s.fun=Math.max(0,s.fun-1*h);s.clean=Math.max(0,s.clean-1*h)}
function toastMsg(t){toast.textContent=t;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1400)}function spark(){for(let i=0;i<4;i++){let e=document.createElement('span');e.className='spark';e.textContent=['✨','💖','⭐'][i%3];e.style.left=(45+Math.random()*12)+'%';e.style.top=(45+Math.random()*15)+'%';scene.appendChild(e);setTimeout(()=>e.remove(),850)}}
const dresses=[['💜','Roxo Sarah',0],['💗','Rosa Princesa',80],['🩵','Azul Gelo',90],['💛','Dourado Real',110],['💚','Verde Jardim',95]];
function openCloset(){modal.classList.add('on');modalTitle.textContent='👗 Guarda-roupa da Sarah';modalBody.innerHTML='<div class="shop">'+dresses.map((d,i)=>`<button class="item" onclick="wear(${i},${d[2]})"><strong>${d[0]}</strong>${d[1]}<br><small>${s.owned.includes(i)?'✅ Já tenho':d[2]+' ⭐'}</small></button>`).join('')+'</div>'}
function wear(i,cost){if(!s.owned.includes(i)){if(s.stars<cost){toastMsg('Faltam estrelas ⭐');return}s.stars-=cost;s.owned.push(i)}s.dress=i;s.fun=Math.min(100,s.fun+8);save();closeModal();toastMsg('Look escolhido! ✨')}
function openShop(){modal.classList.add('on');modalTitle.textContent='🛍️ Loja Mágica';let items=[['🦄','Unicórnio',150],['🐰','Coelhinho',90],['🐱','Gatinho',100],['🎠','Carrossel',180],['🏰','Castelo rosa',250],['🛴','Patinete',120]];modalBody.innerHTML='<div class="shop">'+items.map(x=>`<button class="item" onclick="buy('${x[0]}','${x[1]}',${x[2]})"><strong>${x[0]}</strong>${x[1]}<br><small>${x[2]} ⭐</small></button>`).join('')+'</div>'}
function buy(icon,name,cost){if(s.stars<cost){toastMsg('Junte mais estrelas!');return}s.stars-=cost;s.fun=Math.min(100,s.fun+12);save();toastMsg(name+' comprado! '+icon)}function gift(){s.stars+=20;s.fun=Math.min(100,s.fun+5);save();toastMsg('Presente do dia: +20 ⭐ 🎁');spark()}function closeModal(){modal.classList.remove('on')}render();if('serviceWorker'in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
