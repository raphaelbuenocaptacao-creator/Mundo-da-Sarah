name: Mundo da Sarah PWA Version Align

on:
  push:
    branches: [main]
    paths:
      - 'sw.js'
      - 'index.html'
      - '.github/workflows/pwa-align.yml'

permissions:
  contents: write

jobs:
  align-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align service worker registration with cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          sw = Path('sw.js').read_text()
          html_path = Path('index.html')
          html = html_path.read_text()
          match = re.search(r'v[0-9]+[-A-Za-z0-9._]*', next(line for line in sw.splitlines() if 'CACHE_NAME' in line))
          if not match:
              raise SystemExit('Could not determine service worker version')
          version = match.group(0)
          pattern = r"navigator\.serviceWorker\.register\('\./sw\.js(?:\?v=[^']+)?'(?:,\{updateViaCache:'none'\})?\)"
          replacement = f"navigator.serviceWorker.register('./sw.js?v={version}',{{updateViaCache:'none'}})"
          updated, count = re.subn(pattern, replacement, html, count=1)
          if count != 1:
              raise SystemExit('Could not find service worker registration')
          if updated != html:
              html_path.write_text(updated)
          PY
      - name: Commit alignment when needed
        run: |
          if git diff --quiet -- index.html; then
            echo 'Service worker registration already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(pwa): align Mundo da Sarah service worker version'
          git push
