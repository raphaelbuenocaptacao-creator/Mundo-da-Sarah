<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7557c8">
<link rel="manifest" href="manifest.webmanifest">
<title>Mundo da Sarah • Amizades</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,Arial;background:linear-gradient(#a8ddff,#dfcdfd 48%,#8dcc77);color:#49385f;min-height:100vh}.app{max-width:780px;margin:auto;padding:12px 12px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#ffffffdd;border-radius:20px;padding:12px}.top h1{font-size:20px;margin:0}.back{border:0;border-radius:14px;background:#715bc7;color:#fff;padding:10px 12px;font-weight:900}.scene{position:relative;height:480px;margin-top:12px;border:4px solid #fff;border-radius:26px;overflow:hidden;background:linear-gradient(#86c96f 0 72%,#77b960 72%);box-shadow:0 14px 30px #3454}.path{position:absolute;left:7%;right:7%;top:42%;height:70px;background:#dfcda9;border-radius:45%;transform:rotate(-6deg)}.tree{position:absolute;font-size:66px;filter:drop-shadow(5px 8px 3px #3454)}.t1{left:4%;top:8%}.t2{right:5%;top:12%}.bench{position:absolute;left:45%;top:55%;font-size:48px}.flower{position:absolute;right:17%;bottom:12%;font-size:42px}.character{position:absolute;width:54px;height:82px;transform:translate(-50%,-50%);transition:left .7s ease,top .7s ease;filter:drop-shadow(5px 8px 3px #0004)}.sarah{left:32%;top:58%}.luna{left:68%;top:52%}.hair{position:absolute;left:5px;top:2px;width:44px;height:48px;border-radius:48% 48% 55% 55%;background:#ad825f}.luna .hair{background:#6f4b36}.face{position:absolute;left:12px;top:8px;width:30px;height:30px;border-radius:50%;background:#efc5a5;border:2px solid #9a7058;display:grid;place-items:center;font-size:12px}.body{position:absolute;left:9px;top:37px;width:36px;height:32px;border-radius:13px 13px 8px 8px;background:#8b63d7;border:2px solid #62449d}.luna .body{background:#55a9d8;border-color:#35799d}.name{position:absolute;left:50%;top:-24px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900;white-space:nowrap}.thought{position:absolute;left:50%;top:-54px;transform:translateX(-50%);background:#fff;border-radius:14px;padding:5px 7px;font-size:11px;font-weight:900;white-space:nowrap;opacity:0;transition:.2s}.thought.show{opacity:1}.card{margin-top:12px;background:#ffffffdf;border-radius:22px;padding:13px}.card h2{font-size:17px;margin:0}.bar{height:12px;background:#eadfea;border-radius:999px;overflow:hidden;margin:9px 0}.fill{height:100%;background:linear-gradient(90deg,#ef6cae,#ff9ebf);transition:.25s}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.act{border:0;border-radius:16px;background:#f4ebfb;color:#594576;padding:11px 6px;font-weight:900;min-height:58px}.act:active{transform:scale(.97)}.info{font-size:12px;font-weight:800}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#49385f;color:#fff;border-radius:999px;padding:10px 14px;font-weight:900;opacity:0;transition:.2s}.toast.show{opacity:1;bottom:35px}@media(max-width:520px){.scene{height:410px}.actions{grid-template-columns:1fr}.tree{font-size:55px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><h1>💗 Jardim das Amizades</h1><small>Sarah e Luna</small></div><a class="back" href="./">🏡 Casa</a></div>
<div class="scene" id="scene"><div class="path"></div><div class="tree t1">🌳</div><div class="tree t2">🌳</div><div class="bench">🪑</div><div class="flower">🌸</div>
<div class="character sarah" id="sarah"><div class="name">Sarah</div><div class="hair"></div><div class="face">•ᴗ•</div><div class="body"></div></div>
<div class="character luna" id="luna"><div class="name">Luna</div><div class="thought" id="thought">Oi, Sarah! 💗</div><div class="hair"></div><div class="face">•ᴗ•</div><div class="body"></div></div>
</div>
<div class="card"><h2>💞 Amizade com Luna</h2><div class="bar"><div class="fill" id="fill"></div></div><div class="info" id="status"></div><div class="actions" style="margin-top:10px"><button class="act" id="talk">💬 Conversar</button><button class="act" id="play">🧸 Brincar juntas</button><button class="act" id="gift">🎁 Dar presente</button></div></div>
</div><div class="toast" id="toast"></div>
<script>
const KEY='mundoSarahSocialV1';let s;try{s=JSON.parse(localStorage.getItem(KEY)||'null')||{}}catch{s={}}s.friendship=Math.max(0,Math.min(100,Number(s.friendship)||10));s.chats=Math.max(0,Number(s.chats)||0);s.lastGiftDay=Number(s.lastGiftDay)||0;const fill=document.getElementById('fill'),status=document.getElementById('status'),thought=document.getElementById('thought'),luna=document.getElementById('luna'),toast=document.getElementById('toast');function save(){localStorage.setItem(KEY,JSON.stringify(s))}function render(){fill.style.width=s.friendship+'%';status.textContent=s.friendship>=80?'Melhores amigas 💖 • '+s.friendship+'%':s.friendship>=50?'Grandes amigas 💗 • '+s.friendship+'%':'Construindo amizade • '+s.friendship+'%';save()}function msg(t){thought.textContent=t;thought.classList.add('show');setTimeout(()=>thought.classList.remove('show'),1400)}function pop(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}function add(n,t){s.friendship=Math.min(100,s.friendship+n);s.chats++;msg(t);render()}document.getElementById('talk').onclick=()=>{add(4,'Adorei conversar! 💬');pop('+4 amizade')};document.getElementById('play').onclick=()=>{add(7,'Vamos brincar! 🧸');pop('+7 amizade')};document.getElementById('gift').onclick=()=>{const main=JSON.parse(localStorage.getItem('mundoSarahLife6')||'null')||{};const day=Math.max(1,Number(main.day)||1);if(s.lastGiftDay===day){msg('Já ganhei presente hoje! 💕');return}s.lastGiftDay=day;add(12,'Que presente lindo! 🎁');pop('+12 amizade')};setInterval(()=>{const x=55+Math.random()*28,y=38+Math.random()*34;luna.style.left=x+'%';luna.style.top=y+'%'},4200);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
