<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7557c8">
<link rel="manifest" href="manifest.webmanifest">
<title>Mundo da Sarah • Amizades</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,Arial;background:linear-gradient(#a8ddff,#dfcdfd 48%,#8dcc77);color:#49385f;min-height:100vh}.app{max-width:780px;margin:auto;padding:12px 12px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#ffffffdd;border-radius:20px;padding:12px}.top h1{font-size:20px;margin:0}.back{border:0;border-radius:14px;background:#715bc7;color:#fff;padding:10px 12px;font-weight:900;text-decoration:none}.scene{position:relative;height:500px;margin-top:12px;border:4px solid #fff;border-radius:26px;overflow:hidden;background:linear-gradient(#86c96f 0 72%,#77b960 72%);box-shadow:0 14px 30px #3454;touch-action:manipulation}.iso{position:absolute;left:7%;right:7%;top:19%;bottom:10%;background:linear-gradient(135deg,#9ad483,#7fc16c);border:5px solid #ecdcb7;transform:skewY(-4deg);box-shadow:16px 18px 10px #3455}.path{position:absolute;left:4%;right:4%;top:46%;height:74px;background:#dfcda9;border-radius:45%;transform:rotate(-7deg);box-shadow:inset 0 0 0 4px #d3bd91}.tree{position:absolute;font-size:66px;filter:drop-shadow(5px 8px 3px #3454)}.t1{left:3%;top:8%}.t2{right:4%;top:12%}.bench{position:absolute;left:43%;top:58%;font-size:48px;filter:drop-shadow(4px 6px 2px #0003)}.flower{position:absolute;right:15%;bottom:12%;font-size:42px}.fountain{position:absolute;left:16%;top:29%;font-size:46px;filter:drop-shadow(4px 6px 2px #0003)}.playground{position:absolute;right:13%;top:28%;font-size:48px;filter:drop-shadow(4px 6px 2px #0003)}.target{position:absolute;width:24px;height:24px;border:3px solid white;border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;box-shadow:0 0 0 4px #7b65d888}.target.show{animation:pop .55s ease-out}@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}.character{position:absolute;width:54px;height:82px;transform:translate(-50%,-50%);filter:drop-shadow(5px 8px 3px #0004)}.sarah{left:31%;top:67%;transition:left .08s linear,top .08s linear;z-index:8}.sarah.walk .legL{transform:rotate(18deg)}.sarah.walk .legR{transform:rotate(-18deg)}.luna{left:68%;top:52%;transition:left .8s ease,top .8s ease;z-index:7}.luna.near{filter:drop-shadow(0 0 9px #fff) drop-shadow(5px 8px 3px #0004)}.hair{position:absolute;left:5px;top:2px;width:44px;height:48px;border-radius:48% 48% 55% 55%;background:#ad825f}.luna .hair{background:#6f4b36}.face{position:absolute;left:12px;top:8px;width:30px;height:30px;border-radius:50%;background:#efc5a5;border:2px solid #9a7058;display:grid;place-items:center;font-size:12px}.body{position:absolute;left:9px;top:37px;width:36px;height:32px;border-radius:13px 13px 8px 8px;background:#8b63d7;border:2px solid #62449d}.luna .body{background:#55a9d8;border-color:#35799d}.legL,.legR{position:absolute;top:66px;width:8px;height:15px;border-radius:6px;background:#efc5a5;transform-origin:top;transition:.1s}.legL{left:14px}.legR{right:13px}.name{position:absolute;left:50%;top:-24px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900;white-space:nowrap}.thought{position:absolute;left:50%;top:-54px;transform:translateX(-50%);background:#fff;border-radius:14px;padding:5px 7px;font-size:11px;font-weight:900;white-space:nowrap;opacity:0;transition:.2s}.thought.show{opacity:1}.controls{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:48px 48px 48px;gap:5px;justify-content:center;margin:10px 0 0}.ctrl{border:0;border-radius:16px;background:#ffffffeb;color:#5d4a86;font-size:20px;font-weight:900;box-shadow:0 4px 10px #3453;touch-action:none}.up{grid-column:2}.left{grid-row:2}.meet{grid-row:2;grid-column:2;background:linear-gradient(135deg,#ef6cae,#755dcc);color:white;font-size:11px}.right{grid-row:2;grid-column:3}.down{grid-row:3;grid-column:2}.hint{text-align:center;margin:7px 0 0;font-size:11px;font-weight:900;color:#67577f}.card{margin-top:12px;background:#ffffffdf;border-radius:22px;padding:13px}.card h2{font-size:17px;margin:0}.bar{height:12px;background:#eadfea;border-radius:999px;overflow:hidden;margin:9px 0}.fill{height:100%;background:linear-gradient(90deg,#ef6cae,#ff9ebf);transition:.25s}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.act{border:0;border-radius:16px;background:#f4ebfb;color:#594576;padding:11px 6px;font-weight:900;min-height:58px}.act:disabled{opacity:.42}.act:active{transform:scale(.97)}.info{font-size:12px;font-weight:800}.activityRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.activity{border:0;border-radius:14px;background:#eef7ff;color:#4f5d80;padding:9px 5px;font-weight:900}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#49385f;color:#fff;border-radius:999px;padding:10px 14px;font-weight:900;opacity:0;transition:.2s;z-index:30}.toast.show{opacity:1;bottom:35px}@media(max-width:520px){.scene{height:430px}.actions,.activityRow{grid-template-columns:1fr}.tree{font-size:55px}.controls{margin-top:8px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><h1>💗 Jardim das Amizades</h1><small>ande, encontre a Luna e façam atividades juntas</small></div><a class="back" href="./">🏡 Casa</a></div>
<div class="scene" id="scene"><div class="iso"></div><div class="path"></div><div class="tree t1">🌳</div><div class="tree t2">🌳</div><div class="bench">🪑</div><div class="flower">🌸</div><div class="fountain" data-activity="fountain">⛲</div><div class="playground" data-activity="playground">🛝</div><div class="target" id="target"></div>
<div class="character sarah" id="sarah"><div class="name">Sarah</div><div class="hair"></div><div class="face">•ᴗ•</div><div class="body"></div><div class="legL"></div><div class="legR"></div></div>
<div class="character luna" id="luna"><div class="name">💗 Luna</div><div class="thought" id="thought">Oi, Sarah! 💗</div><div class="hair"></div><div class="face">•ᴗ•</div><div class="body"></div></div>
</div>
<div class="controls" aria-label="Controles"><button class="ctrl up" data-dir="up">▲</button><button class="ctrl left" data-dir="left">◀</button><button class="ctrl meet" id="meet">💗 IR ATÉ LUNA</button><button class="ctrl right" data-dir="right">▶</button><button class="ctrl down" data-dir="down">▼</button></div><p class="hint">Toque no jardim para andar. No computador, use WASD ou as setas.</p>
<div class="card"><h2>💞 Amizade com Luna</h2><div class="bar"><div class="fill" id="fill"></div></div><div class="info" id="status"></div><div class="actions" style="margin-top:10px"><button class="act" id="talk">💬 Conversar</button><button class="act" id="play">🧸 Brincar juntas</button><button class="act" id="gift">🎁 Dar presente</button></div><div class="activityRow"><button class="activity" id="picnic">🧺 Piquenique</button><button class="activity" id="fountainBtn">⛲ Ver fonte</button><button class="activity" id="slideBtn">🛝 Escorregador</button></div></div>
</div><div class="toast" id="toast"></div>
<script>
const SOCIAL_KEY='mundoSarahSocialV1',MAIN_KEY='mundoSarahLife6';
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let s,main;try{s=JSON.parse(localStorage.getItem(SOCIAL_KEY)||'null')||{}}catch{s={}}try{main=JSON.parse(localStorage.getItem(MAIN_KEY)||'null')||{}}catch{main={}}
s.friendship=clamp(Number(s.friendship)||10,0,100);s.chats=Math.max(0,Number(s.chats)||0);s.lastGiftDay=Number(s.lastGiftDay)||0;s.x=clamp(Number(s.x)||31,8,92);s.y=clamp(Number(s.y)||67,19,90);s.activities=Math.max(0,Number(s.activities)||0);
const scene=document.getElementById('scene'),sarah=document.getElementById('sarah'),luna=document.getElementById('luna'),fill=document.getElementById('fill'),status=document.getElementById('status'),thought=document.getElementById('thought'),toast=document.getElementById('toast'),target=document.getElementById('target');
const socialButtons=[document.getElementById('talk'),document.getElementById('play'),document.getElementById('gift')];let near=false,walkTimer=null,hold=null;
function save(){localStorage.setItem(SOCIAL_KEY,JSON.stringify(s));localStorage.setItem(MAIN_KEY,JSON.stringify(main))}
function dist(){const a=sarah.getBoundingClientRect(),b=luna.getBoundingClientRect();return Math.hypot(a.left+a.width/2-b.left-b.width/2,a.top+a.height/2-b.top-b.height/2)}
function render(){sarah.style.left=s.x+'%';sarah.style.top=s.y+'%';near=dist()<100;luna.classList.toggle('near',near);socialButtons.forEach(b=>b.disabled=!near);fill.style.width=s.friendship+'%';status.textContent=(s.friendship>=80?'Melhores amigas 💖':s.friendship>=50?'Grandes amigas 💗':'Construindo amizade')+' • '+s.friendship+'% • '+s.activities+' atividades';save()}
function msg(t){thought.textContent=t;thought.classList.add('show');setTimeout(()=>thought.classList.remove('show'),1400)}
function pop(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}
function step(dx,dy){stopWalk();s.x=clamp(s.x+dx,8,92);s.y=clamp(s.y+dy,19,90);sarah.classList.add('walk');render();setTimeout(()=>sarah.classList.remove('walk'),130)}
function walkTo(x,y,done){stopWalk();const tick=()=>{const dx=x-s.x,dy=y-s.y,d=Math.hypot(dx,dy);if(d<1.4){s.x=x;s.y=y;sarah.classList.remove('walk');render();walkTimer=null;if(done)done();return}s.x+=dx/d*1.25;s.y+=dy/d*1.25;sarah.classList.add('walk');render();walkTimer=setTimeout(tick,38)};tick()}
function stopWalk(){if(walkTimer){clearTimeout(walkTimer);walkTimer=null}sarah.classList.remove('walk')}
function add(n,t){if(!near){pop('Chegue perto da Luna primeiro 💗');return}s.friendship=clamp(s.friendship+n,0,100);s.chats++;msg(t);render()}
function reward(friend,fun,coins,label){s.friendship=clamp(s.friendship+friend,0,100);s.activities++;main.fun=clamp((Number(main.fun)||70)+fun,0,100);main.coins=Math.max(0,(Number(main.coins)||0)+coins);pop(label);render()}
document.getElementById('talk').onclick=()=>add(4,'Adorei conversar! 💬');document.getElementById('play').onclick=()=>{add(7,'Vamos brincar! 🧸');main.fun=clamp((Number(main.fun)||70)+8,0,100);save()};document.getElementById('gift').onclick=()=>{if(!near)return pop('Chegue perto da Luna primeiro 💗');const day=Math.max(1,Number(main.day)||1);if(s.lastGiftDay===day){msg('Já ganhei presente hoje! 💕');return}s.lastGiftDay=day;add(12,'Que presente lindo! 🎁')};
document.getElementById('picnic').onclick=()=>walkTo(48,61,()=>{reward(6,10,-2,'Piquenique com a Luna 🧺');msg('Que delícia! 🍓')});document.getElementById('fountainBtn').onclick=()=>walkTo(21,38,()=>{reward(3,6,1,'Momento na fonte ⛲');msg('Olha a água! ✨')});document.getElementById('slideBtn').onclick=()=>walkTo(79,39,()=>{reward(5,12,0,'Diversão no escorregador 🛝');msg('De novo! 😄')});document.getElementById('meet').onclick=()=>{const r=luna.getBoundingClientRect(),sr=scene.getBoundingClientRect();walkTo(clamp((r.left-sr.left)/sr.width*100-8,8,92),clamp((r.top-sr.top)/sr.height*100+7,19,90),()=>{msg('Oi, Sarah! 💗');render()})};
scene.addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;const r=scene.getBoundingClientRect();const x=clamp((e.clientX-r.left)/r.width*100,8,92),y=clamp((e.clientY-r.top)/r.height*100,19,90);target.style.left=x+'%';target.style.top=y+'%';target.classList.remove('show');void target.offsetWidth;target.classList.add('show');walkTo(x,y)});
document.querySelectorAll('[data-dir]').forEach(btn=>{const d=btn.dataset.dir,go=()=>d==='up'?step(0,-1.5):d==='down'?step(0,1.5):d==='left'?step(-1.5,0):step(1.5,0);btn.addEventListener('pointerdown',e=>{e.preventDefault();go();hold=setInterval(go,85)});['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,()=>{clearInterval(hold);hold=null}))});
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')step(0,-1.5);if(k==='arrowdown'||k==='s')step(0,1.5);if(k==='arrowleft'||k==='a')step(-1.5,0);if(k==='arrowright'||k==='d')step(1.5,0)});
setInterval(()=>{if(near)return;const x=55+Math.random()*28,y=34+Math.random()*34;luna.style.left=x+'%';luna.style.top=y+'%';setTimeout(render,850)},5200);window.addEventListener('resize',render,{passive:true});window.addEventListener('pagehide',()=>{stopWalk();clearInterval(hold);save()},{once:true});render();setTimeout(render,250);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
